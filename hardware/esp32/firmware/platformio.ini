; TITAN V4 Edge - PlatformIO Configuration
; ESP32-S3 with TFLite-Micro + 3x AD8232

[platformio]
build_dir = .pio/build

[common]
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_SUPPORT=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTF_LITE_STATIC_MEMORY
    -fpermissive

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Memory
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_titan.csv

; Serial
monitor_speed = 115200
upload_port = COM_PORT_HERE
monitor_port = COM_PORT_HERE

; Private profile: required for body recordings and sensitive endpoints.
[env:esp32s3]
build_flags = 
    ${common.build_flags}
    -DWIFI_SSID=\"YOUR_PRIVATE_2G4_SSID\"
    -DWIFI_PASS=\"YOUR_PRIVATE_WIFI_PASSWORD\"
    -DWIFI_OPEN_NETWORK=0
    -DALLOW_SENSITIVE_HTTP=1

; Campus profile: connectivity and aggregate quality verification only.
; Raw ECG windows and model results stay blocked on the shared open network.
[env:campus]
build_flags =
    ${common.build_flags}
    -DWIFI_SSID=\"YACHAYTECH\"
    -DWIFI_PASS=\"\"
    -DWIFI_OPEN_NETWORK=1
    -DALLOW_SENSITIVE_HTTP=0

; Private hotspot profile for recording sessions.
[env:private_hotspot]
build_flags =
    ${common.build_flags}
    -DWIFI_PROFILE_PRIVATE=1
    -DWIFI_OPEN_NETWORK=0
    -DALLOW_SENSITIVE_HTTP=1

; Private hotspot profile for electrode, noise, and storage validation.
; It keeps HTTP and raw windows active but disables TFLite inference so sensing
; cannot block the web server during signal-quality tests.
[env:private_hotspot_quality]
build_flags =
    ${common.build_flags}
    -DWIFI_PROFILE_PRIVATE=1
    -DWIFI_OPEN_NETWORK=0
    -DALLOW_SENSITIVE_HTTP=1
    -DENABLE_TFLITE_INFERENCE=0
