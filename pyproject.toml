[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroguardian-titan-v4-ecg"
version = "0.1.0"
description = "TITAN V4 ECG external validation evidence package"
license = "MIT"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "hardware/esp32/tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

